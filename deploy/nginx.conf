# 未配置的 HTTP Host
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 444;
}

# 所有域名 HTTP 请求跳转到 HTTPS + www
server {
    listen 80;
    listen [::]:80;
    server_name ROOT_DOMAIN WWW_DOMAIN;

    return 301 https://WWW_DOMAIN$request_uri;
}

# 未配置的 HTTPS Host
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/ROOT_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ROOT_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
}

# HTTPS 裸域名跳转到 www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ROOT_DOMAIN;

    ssl_certificate /etc/letsencrypt/live/ROOT_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ROOT_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://WWW_DOMAIN$request_uri;
}

# HTTPS www 主站
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name WWW_DOMAIN;

    ssl_certificate /etc/letsencrypt/live/ROOT_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ROOT_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    charset utf-8;
    client_max_body_size 20M;

    location /static/ {
        alias PROJECT_DIR/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias PROJECT_DIR/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}